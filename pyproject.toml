[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fastchunk"
description = "High-performance text chunker with a Rust core and Python bindings"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Kushal" }
]
requires-python = ">=3.10, <3.13"
keywords = ["text-splitter", "chunking", "rag", "langchain", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/kushalkp88/fastchunk"
Repository = "https://github.com/kushalkp88/fastchunk"
Issues = "https://github.com/kushalkp88/fastchunk/issues"

[dependency-groups]
dev = [
    "maturin>=1.5.0,<2.0.0",
    "pytest>=7.0.0",
    "pytest-benchmark>=5.0.0",
    "langchain-text-splitters==1.1.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.maturin]
features = ["pyo3/abi3-py310", "pyo3/extension-module"]
module-name = "fastchunk"
manifest-path = "crates/fastchunk-python/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
