name: Build Wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheel ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (produces manylinux wheel via docker container)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        if: matrix.os != 'ubuntu-latest'

      - name: Build wheels (abi3-py310)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --manifest-path crates/fastchunk-python/Cargo.toml --release --out dist
          sdist: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Validate wheel metadata with twine
        run: uvx twine check dist/*

      - name: Smoke test wheel installation
        run: |
          uv venv test-env
          uv pip install --python test-env dist/*.whl
          uv run --python test-env python -c "from fastchunk import RecursiveCharacterTextSplitter; s = RecursiveCharacterTextSplitter(); assert s.split_text('FastChunk cross-platform test') == ['FastChunk cross-platform test']; print('Smoke test PASSED')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build sdist
        run: uv build --sdist --out-dir dist

      - name: Validate sdist metadata with twine
        run: uvx twine check dist/*

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastchunk-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  check_release:
    name: Verify Release Artifacts
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Inspect and validate all packages
        run: |
          ls -la dist/
          uvx twine check dist/*
